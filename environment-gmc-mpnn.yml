# Validated ECHO compatibility environment for the Chemprop 2.1.0 GMC-MPNN path.
# Preserve the accompanying provenance exports documented in
# docs/gmc_mpnn_environment_compatibility.md for the complete resolved lock.
name: admet-gmc-mpnn
channels:
  - defaults
dependencies:
  # Project-supported Python 3.11 patch. Upstream requires Python >=3.11.
  - python=3.11.15
  - pip
  - pip:
      # Validated ECHO CUDA build; this remains a project pin rather than an
      # upstream GMC-MPNN pin.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - "torch==2.1.2+cu121"

      # Exact bundled Chemprop version at the inspected upstream revision.
      - "chemprop==2.1.0"

      # Validated exact compatibility versions from ECHO.
      - "lightning==2.1.4"
      - "numpy==1.26.4"
      - "scikit-learn==1.9.0"
      - "rdkit==2024.09.6"

      # Lightning 2.1.4 imports pkg_resources. Newer Setuptools releases that
      # remove it are incompatible with this validated environment.
      - "setuptools==80.10.2"

      # Development/testing dependency used for the validated GMC-MPNN suite.
      - "pytest==8.4.2"

      # Ancillary packages remain constrained where their exact resolved versions
      # are captured by the validated pip_freeze.txt provenance export.
      - "pandas<3"
      - "scipy<2"
      - "biopandas<0.6"

      # Do not add torchvision, Transformers, PyTDC, global-descriptor packages,
      # OMEGA, or OpenBabel: none is required by the inspected training path.
