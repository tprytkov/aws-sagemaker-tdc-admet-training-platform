schema_version: "1.0.0"
run_name: chemberta_expanded_ten_head_classification
split_track: coordinated_multitask
prepared_root: ../outputs/local/classification_expansion/coordinated

tasks:
  hia_hou:
    endpoint_config: hia_hou.yaml
    endpoint_id: hia_hou
    tdc_name: HIA_Hou
    task_group: ADME
    task_type: binary_classification
    primary_metric: roc_auc
  pgp_broccatelli:
    endpoint_config: pgp_broccatelli.yaml
    endpoint_id: pgp_broccatelli
    tdc_name: Pgp_Broccatelli
    task_group: ADME
    task_type: binary_classification
    primary_metric: roc_auc
  bbb_martins:
    endpoint_config: bbb_martins.yaml
    endpoint_id: bbb_martins
    tdc_name: BBB_Martins
    task_group: ADME
    task_type: binary_classification
    primary_metric: roc_auc
  cyp1a2_veith:
    endpoint_config: cyp1a2_veith.yaml
    endpoint_id: cyp1a2_veith
    tdc_name: CYP1A2_Veith
    task_group: ADME
    task_type: binary_classification
    primary_metric: roc_auc
  cyp2c19_veith:
    endpoint_config: cyp2c19_veith.yaml
    endpoint_id: cyp2c19_veith
    tdc_name: CYP2C19_Veith
    task_group: ADME
    task_type: binary_classification
    primary_metric: roc_auc
  cyp2c9_veith:
    endpoint_config: cyp2c9_veith.yaml
    endpoint_id: cyp2c9_veith
    tdc_name: CYP2C9_Veith
    task_group: ADME
    task_type: binary_classification
    primary_metric: roc_auc
  cyp2d6_veith:
    endpoint_config: cyp2d6_veith.yaml
    endpoint_id: cyp2d6_veith
    tdc_name: CYP2D6_Veith
    task_group: ADME
    task_type: binary_classification
    primary_metric: roc_auc
  cyp3a4_veith:
    endpoint_config: cyp3a4_veith.yaml
    endpoint_id: cyp3a4_veith
    tdc_name: CYP3A4_Veith
    task_group: ADME
    task_type: binary_classification
    primary_metric: roc_auc
  herg_karim:
    endpoint_config: herg_karim.yaml
    endpoint_id: herg_karim
    tdc_name: hERG_Karim
    task_group: Tox
    task_type: binary_classification
    primary_metric: roc_auc
  ames:
    endpoint_config: ames.yaml
    endpoint_id: ames
    tdc_name: AMES
    task_group: Tox
    task_type: binary_classification
    primary_metric: roc_auc

split_files:
  train: train.csv
  validation: valid.csv
  test: test.csv

audit:
  enforce_exact_smiles_exclusion: true
  enforce_scaffold_exclusion: true
  fail_on_invalid_molecules: true
  fail_on_conflicting_labels: true
  fail_on_duplicates: true

training:
  random_seed: 42
  encoder_learning_rate: 2.0e-5
  head_learning_rate: 1.0e-4
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  task_sampling: temperature
  task_sampling_alpha: 0.5
  class_weighted_loss: false
  model_name_or_path: seyonec/ChemBERTa-zinc-base-v1
  model_revision: null
  pooling: masked_mean
  dropout: 0.15
  train_batch_size: 8
  evaluation_batch_size: 16
  max_sequence_length: 128
  allow_smiles_fallback: false
  max_steps: 3000
  evaluation_interval_steps: 100
  checkpoint_interval_steps: 100
  warmup_ratio: 0.1
  scheduler: linear_warmup_decay
  early_stopping_patience_evaluations: 5
  minimum_training_steps_before_stopping: 500
  mixed_precision: "no"
  endpoint_minimum_roc_auc: {}
  negative_transfer_tolerance:
    hia_hou: 0.02
    pgp_broccatelli: 0.02
    bbb_martins: 0.02
    cyp1a2_veith: 0.02
    cyp2c19_veith: 0.02
    cyp2c9_veith: 0.02
    cyp2d6_veith: 0.02
    cyp3a4_veith: 0.02
    herg_karim: 0.02
    ames: 0.02
  task_loss_weights:
    hia_hou: 1.0
    pgp_broccatelli: 1.0
    bbb_martins: 1.0
    cyp1a2_veith: 1.0
    cyp2c19_veith: 1.0
    cyp2c9_veith: 1.0
    cyp2d6_veith: 1.0
    cyp3a4_veith: 1.0
    herg_karim: 1.0
    ames: 1.0
