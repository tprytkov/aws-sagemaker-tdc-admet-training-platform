schema_version: "1.0.0"
provider: moloptima_internal_chemprop
model_family: chemprop_dmpnn
chemprop_version: "2.3.1"
protocol: internal_leakage_controlled
seeds: [13, 37, 73, 101, 137]
model:
  atom_featurizer: v2
  aggregation: mean
  message_passing_depth: 3
  message_hidden_dim: 300
  ffn_num_layers: 2
  ffn_hidden_dim: 300
  dropout: 0.10
training:
  batch_size: 64
  max_epochs: 100
  early_stopping_patience: 15
  warmup_epochs: 2
  init_lr: 0.0001
  max_lr: 0.001
  final_lr: 0.0001
  gradient_clip_norm: 5.0
  num_workers: 0
  accelerator: auto
preprocessing:
  version: rdkit_complete_structure_v1
  canonical_isomeric_smiles: true
  preserve_disconnected_fragments: true
  preserve_charges: true
  preserve_stereochemistry: true
  largest_fragment_selection: false
  neutralization: false
applicability_domain:
  morgan_radius: 2
  morgan_bits: 2048
  similarity_threshold: 0.40
